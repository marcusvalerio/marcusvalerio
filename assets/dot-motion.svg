<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">What if we just made it? — Marcus Valério</title>
  <desc id="desc">An editorial typographic animation. The question settles into place, a powder-blue underline draws beneath it, and Marcus Valério appears with a restrained fade.</desc>
  <rect width="1200" height="340" fill="#202124"/>

  <defs>
    <clipPath id="headline-reveal">
      <rect x="64" y="34" width="0" height="202">
        <animate attributeName="width" values="0;0;1050;1050" keyTimes="0;.08;.3;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#headline-reveal)" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-5">
    <text x="70" y="126" fill="#F5F4F0" font-size="83">what if</text>
    <text x="70" y="216" fill="#C5D6EB" font-size="83">we just made it?</text>
  </g>

  <path d="M72 239 H72" fill="none" stroke="#C5D6EB" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M72 239 H72;M72 239 H72;M72 239 H695;M72 239 H695;M72 239 H72" keyTimes="0;.23;.43;.83;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.3;.83;1" dur="8s" repeatCount="indefinite"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.48;.6;.84;1" dur="8s" repeatCount="indefinite"/>
    <text x="72" y="300" fill="#F5F4F0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">MARCUS VALÉRIO<tspan fill="#C5D6EB">.</tspan></text>
  </g>

  <rect x="72" y="316" width="0" height="2" fill="#C5D6EB" opacity=".8">
    <animate attributeName="width" values="0;0;1056;1056;0" keyTimes="0;.58;.72;.84;1" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>