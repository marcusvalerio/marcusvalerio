<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">What if we just made it? — Marcus Valério</title>
  <desc id="desc">A typography-led motion piece. The question arrives in oversized editorial type, a powder-blue dot moves through the composition, and Marcus Valério is revealed.</desc>
  <rect width="1200" height="340" fill="#202124"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-5">
    <text x="70" y="126" fill="#F5F4F0" font-size="83" opacity="0">
      what if
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.12;.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x" values="42;70;70;70" keyTimes="0;.12;.88;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="216" fill="#C5D6EB" font-size="83" opacity="0">
      we just made it?
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;.08;.22;.88;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x" values="98;98;70;70;70" keyTimes="0;.08;.22;.88;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <circle cx="1070" cy="201" r="7" fill="#C5D6EB">
    <animate attributeName="cx" values="1070;1060;1010;930;850;850;1070" keyTimes="0;.16;.27;.38;.5;.76;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="201;201;180;230;201;201;201" keyTimes="0;.16;.27;.38;.5;.76;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;7;10;6;7;7;7" keyTimes="0;.16;.27;.38;.5;.76;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.46;.57;.83;1" dur="7s" repeatCount="indefinite"/>
    <text x="72" y="288" fill="#F5F4F0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">MARCUS VALÉRIO<tspan fill="#C5D6EB">.</tspan></text>
    <path d="M72 302H1128" stroke="#C5D6EB" stroke-width="1" stroke-opacity=".55"/>
  </g>
</svg>