<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Marcus Valério — ideas in motion</title>
  <desc id="desc">A playful editorial motion graphic. A blue dot bounces, hits a mark, and reveals Marcus Valério.</desc>
  <rect width="1200" height="340" fill="#202124"/>
  <g stroke="#F5F4F0" stroke-opacity=".15" fill="none"><path d="M38 42H1162M38 298H1162"/><path d="M38 42v12M1162 42v12M38 286v12M1162 286v12"/></g>
  <g fill="#F5F4F0" font-family="monospace" font-size="11" letter-spacing="2"><text x="42" y="28">PERSONAL PLAYGROUND / 001</text><text x="1158" y="28" text-anchor="end">IDEAS ARE CHEAP. MAKE THEM REAL.</text></g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" letter-spacing="-1.2" fill="#F5F4F0">
    <text x="72" y="112">think</text><text x="72" y="148" fill="#C5D6EB">different.</text>
  </g>
  <g fill="none" stroke="#C5D6EB" stroke-width="1.5"><path d="M75 178H1125" stroke-opacity=".35"/><path d="M600 148v60M570 178h60" stroke-opacity=".65"/></g>
  <g fill="#C5D6EB" opacity=".7"><rect x="290" y="86" width="12" height="12" transform="rotate(17 296 92)"/><circle cx="395" cy="242" r="3"/><path d="M850 76l10 10-10 10-10-10z"/><rect x="1015" y="235" width="9" height="9"/></g>
  <circle cx="110" cy="178" r="7" fill="#C5D6EB">
    <animate attributeName="cx" values="110;225;315;440;600;600;600;600" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="178;146;210;144;178;178;178;178" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;7;7;7;13;5;5;7" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="178" r="13" fill="none" stroke="#C5D6EB" opacity="0"><animate attributeName="opacity" values="0;0;0;0;.85;0;0;0" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;6;6;13;40;40;6" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/></circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;1;1" keyTimes="0;.14;.28;.44;.60;.68;.9;1" dur="6.2s" repeatCount="indefinite"/>
    <text x="650" y="174" fill="#F5F4F0" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.8">MARCUS VALÉRIO<tspan fill="#C5D6EB">.</tspan></text>
    <text x="653" y="204" fill="#C5D6EB" font-family="monospace" font-size="11" letter-spacing="2.4">CREATIVE THINKING / PRODUCT BUILDING</text>
  </g>
  <g font-family="monospace" font-size="10" letter-spacing="1.5"><text x="72" y="270" fill="#F5F4F0" fill-opacity=".72">STRATEGY</text><text x="190" y="270" fill="#C5D6EB">+</text><text x="215" y="270" fill="#F5F4F0" fill-opacity=".72">CREATION</text><text x="325" y="270" fill="#C5D6EB">+</text><text x="350" y="270" fill="#F5F4F0" fill-opacity=".72">SYSTEMS</text></g>
  <text x="1158" y="270" text-anchor="end" fill="#F5F4F0" fill-opacity=".5" font-family="monospace" font-size="10" letter-spacing="1.5">MAKE A MESS. FIND A METHOD.</text>
</svg>